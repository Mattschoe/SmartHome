// Compose compiler stability overrides for types NOT compiled with the Compose plugin, so their
// stability cannot be inferred. These are honest promises backed by the state-model conventions in
// CLAUDE.md: the adapter and ViewModel mint fresh immutable data objects per emission and never
// mutate lists/maps in place, so treating them as stable is what lets the page composables skip.
//
// kotlinx-datetime is not compiled with the Compose plugin (inferred unstable otherwise).
kotlinx.datetime.LocalDate
kotlinx.datetime.LocalDateTime
// The stdlib collection interfaces — every list/map handed to a composable is built immutable.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
// Ready.calendarWindow is a ClosedRange<LocalDate>.
kotlin.ranges.ClosedRange
